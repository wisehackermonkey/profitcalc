<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>profit 1st calator</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="BalanceCalc">
</head>
<body>

  <h2>Balance Calculator</h2>

  <label>Balance (b): <input type="number" id="balance" value="" inputmode="decimal" oninput="calculate()"></label>
  <button type="button" onclick="clearBalance()">Clear Balance</button><br><br>
  <label>Profit %: <input type="number" id="profitRate" value="30" inputmode="decimal" oninput="calculate()"></label><br><br>
  <label>Owner's Pay %: <input type="number" id="ownersRate" value="15" inputmode="decimal" oninput="calculate()"></label><br><br>
  <label>Taxed? <input type="checkbox" id="taxed" checked oninput="calculate()"></label><br><br>
  <label>Paying debt service with profit (95%)? <input type="checkbox" id="debtSplit" oninput="calculate()"></label>

  <br><br>
  <small>Tap any amount to copy it to your clipboard.</small>

  <table border="1" cellpadding="6">
    <tr><th>Item</th><th>Fixed %</th><th>Amount</th></tr>
    <tr><td>Profit</td><td id="profitFixedPct"></td><td id="profit" ontouchstart="copyAmount(this)" onclick="copyAmount(this)"></td><td>bancoppel</td></tr>
    <tr id="debtRow" style="display:none"><td>&nbsp;&nbsp;↳ Debt Service (95% profit + INV)</td><td id="debtPct"></td><td id="debtService" ontouchstart="copyAmount(this)" onclick="copyAmount(this)"></td><td>to debt service</td></tr>
    <tr id="remainderRow" style="display:none"><td>&nbsp;&nbsp;↳ Remainder Profit (5%)</td><td id="remainderPct"></td><td id="remainderProfit" ontouchstart="copyAmount(this)" onclick="copyAmount(this)"></td><td>bancoppel leftover</td></tr>
    <tr><td>OwnComp</td><td id="ownersFixedPct"></td><td id="owners" ontouchstart="copyAmount(this)" onclick="copyAmount(this)"></td><td>bbva personal </td></tr>
    <tr id="invRow"><td>INV</td><td id="invFixedPct"></td><td id="inv" ontouchstart="copyAmount(this)" onclick="copyAmount(this)"></td><td>Openbank</td></tr>
    <tr id="taxRow"><td>Tax</td><td id="taxFixedPct"></td><td id="tax" ontouchstart="copyAmount(this)" onclick="copyAmount(this)"></td><td>mercadopago</td></tr>
    <tr><td>OpEx</td><td id="opexPct"></td><td id="opex" ontouchstart="copyAmount(this)" onclick="copyAmount(this)"></td><td>banorte</td></tr>
    <tr><td><strong>Total</strong></td><td></td><td id="total" ontouchstart="copyAmount(this)" onclick="copyAmount(this)"></td></tr>

  </table>

  <script>
    const TAX_FULL_RATE = 1 - 25/29;               // ~13.79%
    const TAX_RATE = TAX_FULL_RATE / 2;            // ~6.90% (half of tax)
    const INV_RATE = 0.15;                         // 15% INV
    const INV_FROM_PROFIT = INV_RATE - TAX_RATE;   // ~8.10% taken from profit

    const STORAGE_KEY = "balanceCalcState";

    // Round to 2 decimals (half-up, float-safe)
    function r2(x) { return Math.round(x * 100 + 1e-6) / 100; }

    function saveState() {
      try {
        const state = {
          balance:   document.getElementById("balance").value,
          taxed:     document.getElementById("taxed").checked,
          debtSplit: document.getElementById("debtSplit").checked
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {}
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const state = JSON.parse(raw);
        if (state.balance !== undefined) document.getElementById("balance").value = state.balance;
        if (state.taxed !== undefined) document.getElementById("taxed").checked = !!state.taxed;
        if (state.debtSplit !== undefined) document.getElementById("debtSplit").checked = !!state.debtSplit;
      } catch (e) {}
    }

    function clearBalance() {
      document.getElementById("balance").value = "";
      calculate();
    }

    function calculate() {
      const b          = parseFloat(document.getElementById("balance").value)    || 0;
      const profitRate = parseFloat(document.getElementById("profitRate").value) / 100 || 0;
      const ownersRate = parseFloat(document.getElementById("ownersRate").value) / 100 || 0;
      const taxed      = document.getElementById("taxed").checked;
      const debtSplit  = document.getElementById("debtSplit").checked;

      const adjProfitRate = profitRate - INV_FROM_PROFIT;

      const profit  = b * adjProfitRate;
      const owners  = b * ownersRate;
      const inv     = b * INV_RATE;
      const tax     = taxed ? b * TAX_RATE : 0;
      const opex    = b - profit - owners - inv - tax;
      const total   = profit + owners + inv + tax + opex;

      // Debt service = 95% of profit, plus the whole INV 15% when checked
      const debtFromProfit  = profit * 0.95;
      const debtService     = debtFromProfit + (debtSplit ? inv : 0);
      const remainderProfit = profit - debtFromProfit;

      // Rounded percentages that tie out to 100.00
      const profitPct    = r2(adjProfitRate * 100);
      const ownersPct    = r2(ownersRate * 100);
      const invPct       = r2(INV_RATE * 100);
      const taxPct       = r2(TAX_RATE * 100);
      const debtProfitPct = r2(profitPct * 0.95);
      const debtPct      = r2(debtProfitPct + (debtSplit ? invPct : 0));
      const remainderPct = r2(profitPct - debtProfitPct);
      const opexPct      = r2(100 - profitPct - ownersPct - invPct - (taxed ? taxPct : 0));

      document.getElementById("profit").textContent          = profit.toFixed(2);
      document.getElementById("owners").textContent          = owners.toFixed(2);
      document.getElementById("inv").textContent             = inv.toFixed(2);
      document.getElementById("tax").textContent             = tax.toFixed(2);
      document.getElementById("opex").textContent            = opex.toFixed(2);
      document.getElementById("total").textContent           = total.toFixed(2);
      document.getElementById("opexPct").textContent         = opexPct.toFixed(2) + "%";
      document.getElementById("profitFixedPct").textContent  = profitPct.toFixed(2) + "%";
      document.getElementById("ownersFixedPct").textContent  = ownersPct.toFixed(2) + "%";
      document.getElementById("invFixedPct").textContent     = invPct.toFixed(2) + "%";
      document.getElementById("taxFixedPct").textContent     = taxPct.toFixed(2) + "%";
      document.getElementById("debtPct").textContent         = debtPct.toFixed(2) + "%";
      document.getElementById("remainderPct").textContent    = remainderPct.toFixed(2) + "%";
      document.getElementById("debtService").textContent     = debtService.toFixed(2);
      document.getElementById("remainderProfit").textContent = remainderProfit.toFixed(2);

      document.getElementById("taxRow").style.opacity        = taxed ? "1" : "0.4";
      document.getElementById("debtRow").style.display       = debtSplit ? "" : "none";
      document.getElementById("remainderRow").style.display  = debtSplit ? "" : "none";
      document.getElementById("invRow").style.display        = debtSplit ? "none" : "";

      saveState();
    }

    function copyAmount(cell) {
      const value = cell.textContent;
      if (!value) return;

      const finish = () => {
        const originalBg = cell.style.backgroundColor;
        cell.style.backgroundColor = "#c8f7c5";
        setTimeout(() => {
          cell.style.backgroundColor = originalBg;
        }, 600);
      };

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(value).then(finish).catch(finish);
      } else {
        // Fallback for older browsers / non-secure contexts
        const textarea = document.createElement("textarea");
        textarea.value = value;
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        try { document.execCommand("copy"); } catch (e) {}
        document.body.removeChild(textarea);
        finish();
      }
    }

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js");
    }

    loadState();
    calculate();
  </script>

</body>
</html>
